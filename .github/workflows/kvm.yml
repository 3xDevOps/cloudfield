name: VM tests

# make test-kvm on a hosted x86-64 runner, which exposes /dev/kvm through
# nested virtualization. ci-suite.yml calls it in the merge queue for a
# change that can affect the VM tests and in every nightly run;
# `gh workflow run kvm.yml --ref <branch>` runs it for any branch. The guest
# kernel takes up to six minutes to build, so it builds only when its
# inputs change: the cache is keyed by their hash and written on main. It
# saves no compiler cache for its static builds: the repository's Actions
# cache is already over its size limit.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mems:
        default: '[2048, 8192]'
      filesystems:
        default: '["ext4", "xfs"]'
      cycles:
        default: '12'
      mincore_cycles:
        default: '12'
      churn_min:
        default: '10'
      n:
        default: '10'
      sections:
        default: chain,timing,idle,baseline,frag,mincore,direct,chcow

permissions:
  contents: read

jobs:
  kvm:
    name: fclazy ${{ matrix.fs }} ${{ matrix.mem }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        mem: ${{ fromJSON(inputs.mems) }}
        fs: ${{ fromJSON(inputs.filesystems) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      # The config, the build script and the container recipe make kernel
      # runs are everything that decides the kernel's bytes.
      - name: Hash the guest kernel's inputs
        id: kernel
        run: echo "key=kernel-v1-$({ cat images/kernel/*; make -n kernel; } | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/aether-vmlinux-x86_64
          key: ${{ steps.kernel.outputs.key }}
      - name: Build the guest kernel
        if: ${{ steps.kernel-cache.outputs.cache-hit != 'true' }}
        run: make kernel
      - uses: actions/cache/save@v4
        if: ${{ steps.kernel-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        with:
          path: dist/aether-vmlinux-x86_64
          key: ${{ steps.kernel.outputs.key }}
      # The install a server runs, so the job uses the Cloud Hypervisor pin
      # and the tool list servers get.
      - name: Install what session VMs need (aether-server vm install)
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aether-server" ./cmd/aether-server
          sudo "$RUNNER_TEMP/aether-server" vm install --vm-kernel "$PWD/dist/aether-vmlinux-x86_64"
      - name: Firecracker lazy restore and diff snapshots
        env:
          FCLAZY_MEM: ${{ matrix.mem }}
          FCLAZY_FS: ${{ matrix.fs }}
          FCLAZY_CYCLES: ${{ inputs.cycles }}
          FCLAZY_MINCORE_CYCLES: ${{ inputs.mincore_cycles }}
          FCLAZY_CHURN_MIN: ${{ inputs.churn_min }}
          FCLAZY_N: ${{ inputs.n }}
          FCLAZY_SECTIONS: ${{ inputs.sections }}
        run: sudo env "PATH=$PATH" "HOME=$HOME" FCLAZY_MEM="$FCLAZY_MEM" FCLAZY_FS="$FCLAZY_FS" FCLAZY_CYCLES="$FCLAZY_CYCLES" FCLAZY_MINCORE_CYCLES="$FCLAZY_MINCORE_CYCLES" FCLAZY_CHURN_MIN="$FCLAZY_CHURN_MIN" FCLAZY_N="$FCLAZY_N" FCLAZY_SECTIONS="$FCLAZY_SECTIONS" bash scratch/fclazy/run.sh
