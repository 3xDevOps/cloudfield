name: VM tests

# Scratch probe, never merged: which sibling unit makes systemd write a
# unit's MemoryMax back, on the runner's systemd.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          sudo bash -s <<'EOF'
          set -u
          systemctl --version | head -1
          S=aether.slice; A=probe-a.service; B=probe-b.service; R=/sys/fs/cgroup/$S
          mm() { cat $R/$A/memory.max 2>&1; }
          sc() { tr '\n' ' ' <$R/cgroup.subtree_control; }
          run() {
            unit=$1; shift; args=""; for p in "$@"; do args="$args -p $p"; done
            systemd-run --quiet --collect --unit=$unit --slice=$S $args sleep infinity
          }
          for mode in direct setprop; do
            for own in "MemoryMax=100M MemorySwapMax=0" "MemoryMax=100M MemorySwapMax=0 CPUQuota=150%"; do
              for props in "CPUQuota=150%" "CPUWeight=50" "MemoryMax=100M MemorySwapMax=0 CPUQuota=150%" "MemoryMax=100M MemorySwapMax=0" "IOWeight=50"; do
                run $A $own
                if [ $mode = direct ]; then echo max >$R/$A/memory.max; else systemctl set-property --runtime $A MemoryMax=infinity; fi
                before="$(mm) [$(sc)]"
                run $B $props
                now=$(mm); sleep 1; started="$now then $(mm) [$(sc)]"
                [ $mode = direct ] && echo max >$R/$A/memory.max
                systemctl stop $B
                now=$(mm); sleep 1; stopped="$now then $(mm) [$(sc)]"
                echo "PROBE mode=$mode own='$own' sibling='$props' lifted=$before | after-start=$started | after-stop=$stopped"
                systemctl stop $A
              done
            done
          done
          EOF
