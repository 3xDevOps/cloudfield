name: VM tests

# make test-kvm on a hosted x86-64 runner, which exposes /dev/kvm through
# nested virtualization. ci-suite.yml calls it in the merge queue for a
# change that can affect the VM tests and in every nightly run;
# `gh workflow run kvm.yml --ref <branch>` runs it for any branch. The guest
# kernel takes up to six minutes to build, so it builds only when its
# inputs change: the cache is keyed by their hash and written on main. It
# saves no compiler cache for its static builds: the repository's Actions
# cache is already over its size limit.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      rounds:
        default: "5"
      sizes:
        default: "[2, 8]"
      arms:
        default: "P,Q,R,S"

permissions:
  contents: read

jobs:
  kvm:
    name: make test-kvm
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        gib: ${{ fromJSON(inputs.sizes || '[2, 8]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      # The config, the build script and the container recipe make kernel
      # runs are everything that decides the kernel's bytes.
      - name: Hash the guest kernel's inputs
        id: kernel
        run: echo "key=kernel-v1-$({ cat images/kernel/*; make -n kernel; } | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/aether-vmlinux-x86_64
          key: ${{ steps.kernel.outputs.key }}
      - name: Build the guest kernel
        if: ${{ steps.kernel-cache.outputs.cache-hit != 'true' }}
        run: make kernel
      - uses: actions/cache/save@v4
        if: ${{ steps.kernel-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        with:
          path: dist/aether-vmlinux-x86_64
          key: ${{ steps.kernel.outputs.key }}
      # The install a server runs, so the job uses the Cloud Hypervisor pin
      # and the tool list servers get.
      - name: Install what session VMs need (aether-server vm install)
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aether-server" ./cmd/aether-server
          sudo "$RUNNER_TEMP/aether-server" vm install --vm-kernel "$PWD/dist/aether-vmlinux-x86_64"
      # Scratch experiment ch-first-save-cost, never merged: Cloud Hypervisor
      # v55.0 and the engine's directory on an XFS reflink loop device.
      - name: XFS reflink directory and Cloud Hypervisor v55.0
        run: |
          set -euxo pipefail
          df -hT / /mnt /tmp || true
          base=/mnt
          [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ] || base=/var/tmp
          command -v mkfs.xfs || sudo apt-get install -qq -y xfsprogs
          sudo mkdir -p "$base/lazy/xfs" "$base/lazy/dump"
          sudo truncate -s 48G "$base/lazy/xfs.img"
          sudo mkfs.xfs -q -m reflink=1 "$base/lazy/xfs.img"
          dev=$(sudo losetup --find --show --direct-io=on "$base/lazy/xfs.img")
          sudo mount "$dev" "$base/lazy/xfs"
          echo "LAZY_BASE=$base/lazy" >> "$GITHUB_ENV"
          sudo curl -fsSL -o /usr/local/bin/cloud-hypervisor https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v55.0/cloud-hypervisor-static
          sudo chmod 755 /usr/local/bin/cloud-hypervisor
          echo "LAZY-ENV ch=$(cloud-hypervisor --version) sha256=$(sha256sum /usr/local/bin/cloud-hypervisor | cut -d' ' -f1)"
          echo "LAZY-ENV cpu=$(lscpu | sed -n 's/^Model name: *//p') nproc=$(nproc) mem_mib=$(free -m | awk '/^Mem:/{print $2}') kernel=$(uname -r) virt=$(systemd-detect-virt)"
          echo "LAZY-ENV mount=$(findmnt -no SOURCE,FSTYPE,OPTIONS "$base/lazy/xfs") loop=$(losetup -l -n -O NAME,DIO,BACK-FILE "$dev" | tr -s ' ') base_fs=$(findmnt -no FSTYPE -T "$base/lazy/dump")"
          echo "LAZY-ENV xfs_write_1g_fsync: $(sudo dd if=/dev/zero of="$base/lazy/xfs/w.bin" bs=1M count=1024 conv=fsync 2>&1 | tail -1)"
          sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'
          echo "LAZY-ENV xfs_read_1g_cold: $(sudo dd if="$base/lazy/xfs/w.bin" of=/dev/null bs=1M 2>&1 | tail -1)"
          sudo rm "$base/lazy/xfs/w.bin"
      - name: First save cost (real Cloud Hypervisor VMs)
        env:
          GOFLAGS: -v
          GIB: ${{ matrix.gib }}
          ROUNDS: ${{ inputs.rounds || '5' }}
          ARMS: ${{ inputs.arms || 'P,Q,R,S' }}
        run: >
          sudo env "PATH=$PATH" "HOME=$HOME" "GOFLAGS=$GOFLAGS" "TMPDIR=$LAZY_BASE/xfs"
          "AETHER_LAZY_GIB=$GIB" "AETHER_LAZY_ROUNDS=$ROUNDS" "AETHER_LAZY_ARMS=$ARMS" "AETHER_LAZY_DUMP_DIR=$LAZY_BASE/dump"
          make test-kvm KVM_RUN=^TestKVMZZLazyFirstSave KVM_PKGS=./internal/runtime/vm KVM_TIMEOUT=280m
