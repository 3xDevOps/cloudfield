name: VM tests

# make test-kvm on a hosted x86-64 runner, which exposes /dev/kvm through
# nested virtualization. ci-suite.yml calls it in the merge queue for a
# change that can affect the VM tests and in every nightly run;
# `gh workflow run kvm.yml --ref <branch>` runs it for any branch. The guest
# kernel takes up to six minutes to build, so it builds only when its
# inputs change: the cache is keyed by their hash and written on main. It
# saves no compiler cache for its static builds: the repository's Actions
# cache is already over its size limit.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      arms:
        description: Lazy-restore experiment arms, a JSON list
        default: '["E"]'
      sizes:
        description: Session memory limits in MiB, a JSON list
        default: '[2048]'
      cold:
        default: '30'
      warm:
        default: '10'

permissions:
  contents: read

jobs:
  kvm:
    name: lazy ${{ matrix.arm }} ${{ matrix.mib }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        mib: ${{ fromJSON(inputs.sizes || '[2048]') }}
        arm: ${{ fromJSON(inputs.arms || '["E"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          mode: restore
      # The config, the build script and the container recipe make kernel
      # runs are everything that decides the kernel's bytes.
      - name: Hash the guest kernel's inputs
        id: kernel
        run: echo "key=kernel-v1-$({ cat images/kernel/*; make -n kernel; } | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/aether-vmlinux-x86_64
          key: ${{ steps.kernel.outputs.key }}
      - name: Build the guest kernel
        if: ${{ steps.kernel-cache.outputs.cache-hit != 'true' }}
        run: make kernel
      - uses: actions/cache/save@v4
        if: ${{ steps.kernel-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        with:
          path: dist/aether-vmlinux-x86_64
          key: ${{ steps.kernel.outputs.key }}
      # The install a server runs, so the job uses the Cloud Hypervisor pin
      # and the tool list servers get.
      - name: Install what session VMs need (aether-server vm install)
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aether-server" ./cmd/aether-server
          sudo "$RUNNER_TEMP/aether-server" vm install --vm-kernel "$PWD/dist/aether-vmlinux-x86_64"
      # Scratch, never merged: the lazy-restore experiment in place of the
      # VM tests. Cloud Hypervisor publishes no checksum file; the hash is
      # printed for the record.
      - name: Install Cloud Hypervisor v55.0 beside the pinned one
        run: |
          sudo curl -fsSL -o /usr/local/bin/cloud-hypervisor-v55 https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v55.0/cloud-hypervisor-static
          sudo chmod +x /usr/local/bin/cloud-hypervisor-v55
          for b in cloud-hypervisor cloud-hypervisor-v55; do echo "LAZY-ENV $b: $(/usr/local/bin/$b --version) sha256=$(sha256sum /usr/local/bin/$b | cut -d' ' -f1)"; done
      - name: Lazy restore experiment
        env:
          LAZY_ARM: ${{ matrix.arm }}
          LAZY_MIB: ${{ matrix.mib }}
          LAZY_COLD: ${{ inputs.cold || '30' }}
          LAZY_WARM: ${{ inputs.warm || '10' }}
        run: |
          work=/tmp
          if [ "$(df --output=avail /mnt 2>/dev/null | tail -1)" -gt "$(df --output=avail /tmp | tail -1)" ]; then work=/mnt/lazy; sudo mkdir -p "$work"; fi
          echo "LAZY-ENV work=$work cpu=$(lscpu | sed -n 's/^Model name: *//p') nproc=$(nproc) mem_mib=$(free -m | awk '/^Mem:/{print $2}') swap_mib=$(free -m | awk '/^Swap:/{print $2}') kernel=$(uname -r)"
          echo "LAZY-ENV fs: $(df -T "$work" | tail -1)"
          echo "LAZY-ENV userfaultfd: $(ls -l /dev/userfaultfd 2>&1) unprivileged=$(cat /proc/sys/vm/unprivileged_userfaultfd)"
          echo "LAZY-ENV host agents: $(ps -eo pid,user,comm | grep -iE 'provjob|hosted-compute|Runner|walinux|mdsd|defender' | tr '\n' ';')"
          sudo env "PATH=$PATH" "HOME=$HOME" GOFLAGS=-v "TMPDIR=$work" "LAZY_ARM=$LAZY_ARM" "LAZY_MIB=$LAZY_MIB" "LAZY_COLD=$LAZY_COLD" "LAZY_WARM=$LAZY_WARM" \
            LAZY_CH55=/usr/local/bin/cloud-hypervisor-v55 LAZY_BUDGET_MIN=290 \
            make test-kvm KVM_RUN=^TestKVMZZLazy KVM_PKGS=./internal/runtime/vm KVM_TIMEOUT=340m
